<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina de Ejemplo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 3rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .badge {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1.25rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #818cf8;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      color: #fff;
      font-weight: 600;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Ejemplo</span>
    <h1>Hola, Mundo</h1>
    <p>Esta es una pagina de ejemplo creada con HTML y CSS puro. Sirve como punto de partida para cualquier proyecto web.</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-value">HTML</div>
        <div class="stat-label">Estructura</div>
      </div>
      <div class="stat">
        <div class="stat-value">CSS</div>
        <div class="stat-label">Estilos</div>
      </div>
      <div class="stat">
        <div class="stat-value">100%</div>
        <div class="stat-label">Local</div>
      </div>
    </div>

    <button class="btn" onclick="alert('Funciona correctamente.')">Probar interaccion</button>
  </div>

  <footer>Servida localmente con Python &bull; http://localhost:8080</footer>
</body>
</html>
